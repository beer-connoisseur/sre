apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: prober
        image: url-shortener-backend:1.0.0
        imagePullPolicy: IfNotPresent
        args: ["probe"]
        ports:
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: url-shortener-config
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
