server:
  datasource:
    url: http://vm-single-victoria-metrics-single-server:8428
  extraArgs:
    external.url: http://localhost:8880
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  config:
    alerts:
      groups:
      - name: url-shortener-slo
        interval: 30s
        rules:
        - alert: ProberFailing
          expr: |
            sum(rate(urlshort_prober_runs_total{result="success"}[2m]))
              / sum(rate(urlshort_prober_runs_total[2m])) < 0.99
          for: 2m
          labels:
            severity: critical
            service: url-shortener
          annotations:
            summary: "Пробер: успешных прогонов {{ $value | humanizePercentage }} (SLO 99 %)"
            description: "Синтетический сценарий создать → перейти → удалить ссылку через frontend проваливается больше 2 минут: пользователи не могут пользоваться сервисом."
            runbook: "kubectl logs -n url-shortener deploy/prober — на каком шаге и с каким кодом падает; затем логи backend и postgres, kubectl get pods -n url-shortener."
        - alert: HighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{app="backend", route!~"/healthz|/readyz", status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{app="backend", route!~"/healthz|/readyz"}[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
            service: url-shortener
          annotations:
            summary: "Backend: доля ответов 5xx {{ $value | humanizePercentage }} (SLO не более 1 %)"
            description: "Больше 1 % запросов к API за 5 минут завершаются серверной ошибкой."
            runbook: "Найти ошибки: в VictoriaLogs service.name:url-shortener-backend level:error, поле error и request_id; проверить postgres (pg_up) и последний релиз (kubectl rollout history deployment/backend -n url-shortener)."
        - alert: SlowRedirects
          expr: |
            sum(rate(http_request_duration_seconds_bucket{app="backend", route="/r/:code", le="0.25"}[5m]))
              / sum(rate(http_request_duration_seconds_count{app="backend", route="/r/:code"}[5m])) < 0.95
          for: 5m
          labels:
            severity: warning
            service: url-shortener
          annotations:
            summary: "Редиректы: быстрее 250 мс только {{ $value | humanizePercentage }} (SLO 95 %)"
            description: "Переходы по коротким ссылкам замедлились: меньше 95 % укладываются в 250 мс за 5 минут."
            runbook: "Проверить нагрузку и CPU backend, пул соединений (pgxpool_acquired_conns, pgxpool_empty_acquire) и задержки postgres; не включена ли деградация CHAOS_LATENCY."
      - name: url-shortener-runtime
        interval: 30s
        rules:
        - alert: BackendMemoryHigh
          expr: |
            max by (namespace, pod) (process_resident_memory_bytes{app="backend"})
              / max by (namespace, pod) (container_spec_memory_limit_bytes{namespace="url-shortener", pod=~"backend-.+"}) > 0.9
          for: 5m
          labels:
            severity: warning
            service: url-shortener
          annotations:
            summary: "Backend {{ $labels.pod }}: память {{ $value | humanizePercentage }} от лимита контейнера"
            description: "Резидентная память процесса Go больше 90 % лимита контейнера дольше 5 минут: дальше OOMKill и рестарт пода."
            runbook: "Посмотреть рост go_memstats_heap_inuse_bytes и go_goroutines (утечка?), kubectl top pod -n url-shortener; при необходимости поднять limits.memory в k8s/04-backend.yml."

alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  extraVolumes:
  - name: telegram
    secret:
      secretName: alertmanager-telegram
  extraVolumeMounts:
  - name: telegram
    mountPath: /etc/alertmanager/telegram
    readOnly: true
  config:
    route:
      receiver: telegram-critical
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
      - matchers:
        - severity="warning"
        receiver: telegram-warning
        repeat_interval: 12h
    receivers:
    - name: telegram-critical
      telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/bot-token
        chat_id: &chat_id 852738255
        send_resolved: true
        http_config: &http_config
          proxy_url: http://host.minikube.internal:10809
        parse_mode: HTML
        message: &message |-
          <b>[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ if eq $.Status "firing" }}{{ .Annotations.description }}
          <i>Runbook:</i> {{ .Annotations.runbook }}{{ end }}
          {{ end }}
    - name: telegram-warning
      telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/bot-token
        chat_id: *chat_id
        send_resolved: true
        http_config: *http_config
        parse_mode: HTML
        disable_notifications: true
        message: *message
