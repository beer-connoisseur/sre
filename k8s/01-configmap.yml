apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
  namespace: url-shortener
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: shortener
  HTTP_PORT: "8080"
  METRICS_PORT: "9090"
  SHUTDOWN_TIMEOUT: 10s
  LOG_LEVEL: info
  CHAOS_ERROR_RATE: "0"
  CHAOS_LATENCY: 0s
  PROBER_TARGET_URL: http://frontend
  PROBER_INTERVAL: 10s
  PROBER_TIMEOUT: 3s
