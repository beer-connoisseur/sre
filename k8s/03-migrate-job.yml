apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: url-shortener
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: url-shortener-backend:1.0.0
        imagePullPolicy: IfNotPresent
        args: ["migrate"]
        envFrom:
        - configMapRef:
            name: url-shortener-config
        - secretRef:
            name: postgres-credentials
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
