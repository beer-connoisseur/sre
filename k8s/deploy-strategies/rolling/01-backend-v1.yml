# ROLLING — шаг 1: стартовая версия 1.0.0.
# Один Deployment `backend` (как в базовом k8s/04-backend.yml, но с меткой version
# на подах), Service `backend` и HTTPRoute через Envoy Gateway.
# Gateway API не дробит трафик: HTTPRoute всегда смотрит на Service `backend`,
# а Kubernetes сам заменяет поды по одному при обновлении Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: url-shortener
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: url-shortener-backend:1.0.0
        imagePullPolicy: IfNotPresent
        args: ["serve"]
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: url-shortener-config
        - secretRef:
            name: postgres-credentials
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: url-shortener
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: url-shortener
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend
          port: 8080
