# CANARY — шаг 1: 90% трафика на стабильную 1.0.0, 10% на новую 2.0.0.
# В Gateway API дробление делается весами (weight) в backendRefs одного HTTPRoute.
# Обе версии должны быть подняты: kubectl apply -f ../blue-green/backend-v1.yml -f ../blue-green/backend-v2.yml
# Дальше постепенно увеличиваем долю v2: 50/50 -> 0/100 (соседние файлы).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: url-shortener
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1
          port: 8080
          weight: 90
        - name: backend-v2
          port: 8080
          weight: 10
