# CANARY — шаг 3 (финал): 0/100 — 100% трафика на 2.0.0.
# После этого версию 1.0.0 можно масштабировать в 0 или удалить.
# Откат на любом шаге — вернуть предыдущие веса (10 или 50).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: url-shortener
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1
          port: 8080
          weight: 0
        - name: backend-v2
          port: 8080
          weight: 100
