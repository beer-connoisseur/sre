# A/B TESTING — маршрутизация по заголовку на точно выбранную аудиторию.
# В отличие от canary (веса = случайная выборка запросов), здесь на новую версию
# попадают только те, у кого есть заголовок `x-user-group: beta`.
# Правило 1: заголовок x-user-group: beta -> backend-v2 (2.0.0).
# Правило 2 (по умолчанию): все остальные -> backend-v1 (1.0.0).
#
# Проверка (порт 8888 уже проброшен traffic.sh):
#   curl -s -D - -o /dev/null http://localhost:8888/healthz | grep -i x-version
#     -> X-Version: 1.0.0
#   curl -s -D - -o /dev/null -H 'x-user-group: beta' http://localhost:8888/healthz | grep -i x-version
#     -> X-Version: 2.0.0
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: url-shortener
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: backend-v2
          port: 8080
    - backendRefs:
        - name: backend-v1
          port: 8080
