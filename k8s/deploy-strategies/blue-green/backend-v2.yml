# BLUE/GREEN — версия 2.0.0 («blue» / новая). Поднимается одновременно с green,
# но не получает пользовательского трафика, пока HTTPRoute не переключён.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: url-shortener
  labels:
    app: backend
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
      version: "2.0.0"
  template:
    metadata:
      labels:
        app: backend
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: url-shortener-backend:2.0.0
        imagePullPolicy: IfNotPresent
        args: ["serve"]
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: url-shortener-config
        - secretRef:
            name: postgres-credentials
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: url-shortener
  labels:
    app: backend
    version: "2.0.0"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: backend
    version: "2.0.0"
