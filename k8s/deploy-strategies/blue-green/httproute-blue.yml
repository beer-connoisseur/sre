# BLUE/GREEN — мгновенное переключение всего трафика на «синюю» (новую) версию 2.0.0.
# Применяется поверх httproute-green.yaml: HTTPRoute тот же (`backend`), меняется
# только backendRef. Откат — так же мгновенно: снова применить green-маршрут.
# Старая версия (backend-v1) остаётся поднятой — на случай отката.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: url-shortener
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v2   # blue
          port: 8080
