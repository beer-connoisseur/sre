x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-shortener}
  POSTGRES_USER: ${POSTGRES_USER:-shortener}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, copy .env.example to .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: url-shortener-backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-dev}
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: url-shortener-backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *backend-env
      HTTP_PORT: "8080"
      SHUTDOWN_TIMEOUT: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"

  frontend:
    image: url-shortener-frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
